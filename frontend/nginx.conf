server {
    listen 80;

    # Allow large document uploads.
    client_max_body_size 200m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the FastAPI backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ── Streaming (NDJSON chat) ──────────────────────────────────────────
        # These are essential so tokens reach the browser as they are produced
        # instead of being held back by nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # The LLM can take a while to generate a full answer.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Retry on transient backend startup failures.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}