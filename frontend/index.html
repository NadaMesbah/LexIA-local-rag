<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Local — Base de Connaissance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: { typeset: false }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:#0e0f11; --surface:#16181c; --surface2:#1e2127;
      --border:#2a2d35; --border2:#353840;
      --text:#e8e9ec; --muted:#6b7080;
      --accent:#6c8cf5; --accent2:#3d5ae8; --gold:#d4a843;
      --success:#4caf7d; --danger:#e05252;
      --serif:'DM Serif Display',serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
    }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.6; }

    .app { display:grid; grid-template-columns:260px 1fr 300px; grid-template-rows:56px 1fr; height:100vh; }

    /* Topbar */
    .topbar { grid-column:1 / -1; display:flex; align-items:center; padding:0 24px; border-bottom:1px solid var(--border); background:var(--surface); gap:16px; }
    .topbar-logo { font-family:var(--serif); font-size:20px; letter-spacing:-0.02em; }
    .topbar-logo span { color:var(--accent); }
    .topbar-sep { flex:1; }
    .model-badge { font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:4px 10px; }
    .lang-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .lang-toggle button { background:transparent; border:none; color:var(--muted); font-family:var(--mono); font-size:11px; padding:5px 9px; cursor:pointer; transition:background .15s,color .15s; }
    .lang-toggle button.active { background:var(--surface2); color:var(--text); }
    .lang-toggle button:hover { color:var(--text); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s; }
    .status-dot.ready{background:var(--success);box-shadow:0 0 6px var(--success);}
    .status-dot.loading{background:var(--gold);animation:pulse 1s infinite;}
    .status-dot.error{background:var(--danger);}
    .status-label { font-size:12px; color:var(--muted); font-family:var(--mono); }
    @keyframes pulse {0%,100%{opacity:1}50%{opacity:.4}}

    /* Generic sidebar */
    .sidebar { background:var(--surface); display:flex; flex-direction:column; overflow:hidden; }
    .sidebar.left { border-right:1px solid var(--border); }
    .sidebar.right { border-left:1px solid var(--border); }
    .sidebar-head { padding:16px; display:flex; align-items:center; justify-content:space-between; }
    .sidebar-title { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }

    .new-chat-btn { margin:0 16px 8px; width:calc(100% - 32px); padding:10px; border:1px solid var(--border2); background:var(--surface2); color:var(--text); border-radius:8px; font-family:var(--sans); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:border-color .2s,background .2s; }
    .new-chat-btn:hover { border-color:var(--accent); background:rgba(108,140,245,.08); }

    /* Session list */
    .session-list { flex:1; overflow-y:auto; padding:4px 8px 8px; }
    .session-item { display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:7px; cursor:pointer; transition:background .15s; margin-bottom:2px; }
    .session-item:hover { background:var(--surface2); }
    .session-item.active { background:var(--surface2); border:1px solid var(--border2); }
    .session-ico { color:var(--muted); font-size:13px; flex-shrink:0; }
    .session-title { font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session-del { width:20px; height:20px; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; border-radius:4px; opacity:0; flex-shrink:0; }
    .session-item:hover .session-del { opacity:1; }
    .session-del:hover { background:rgba(224,82,82,.15); color:var(--danger); }

    /* Upload */
    .upload-zone { margin:0 16px; border:1.5px dashed var(--border2); border-radius:8px; padding:18px 12px; text-align:center; cursor:pointer; transition:border-color .2s,background .2s; position:relative; }
    .upload-zone:hover, .upload-zone.drag { border-color:var(--accent); background:rgba(108,140,245,.06); }
    .upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
    .upload-icon { font-size:20px; margin-bottom:6px; }
    .upload-text { font-size:12px; color:var(--muted); }
    .upload-text strong { color:var(--accent); font-weight:500; }
    .supported-types { margin-top:6px; font-size:10px; font-family:var(--mono); color:var(--border2); }
    .upload-progress { display:none; margin:10px 16px 0; }
    .upload-progress.visible { display:block; }
    .progress-bar { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    .progress-fill { height:100%; background:var(--accent); border-radius:2px; width:0; transition:width .3s; }
    .progress-label { font-size:11px; color:var(--muted); margin-top:4px; }

    /* Doc list */
    .doc-list { flex:1; overflow-y:auto; padding:8px; }
    .doc-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:6px; transition:background .15s; }
    .doc-item:hover { background:var(--surface2); }
    .doc-icon { width:30px; height:30px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:500; font-family:var(--mono); flex-shrink:0; }
    .doc-icon.pdf{background:rgba(224,82,82,.15);color:#e05252;}
    .doc-icon.txt{background:rgba(108,140,245,.15);color:var(--accent);}
    .doc-icon.docx,.doc-icon.doc{background:rgba(76,175,125,.15);color:var(--success);}
    .doc-icon.md{background:rgba(212,168,67,.15);color:var(--gold);}
    .doc-icon.csv,.doc-icon.xlsx,.doc-icon.pptx,.doc-icon.html{background:rgba(107,112,128,.18);color:var(--muted);}
    .doc-name { font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .doc-chunks { font-size:10px; font-family:var(--mono); color:var(--muted); flex-shrink:0; }
    .doc-del { width:20px; height:20px; border-radius:4px; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; opacity:0; transition:opacity .15s,background .15s,color .15s; }
    .doc-item:hover .doc-del { opacity:1; }
    .doc-del:hover { background:rgba(224,82,82,.15); color:var(--danger); }
    .empty-hint { text-align:center; padding:24px 16px; color:var(--muted); font-size:12px; line-height:1.8; }

    .kb-stats { padding:10px 16px; border-top:1px solid var(--border); display:flex; gap:16px; }
    .stat { font-size:11px; color:var(--muted); font-family:var(--mono); }
    .stat strong { color:var(--text); }

    /* Main chat */
    .main { display:flex; flex-direction:column; overflow:hidden; }
    .messages { flex:1; overflow-y:auto; padding:32px 8% 16px; display:flex; flex-direction:column; gap:24px; scroll-behavior:smooth; }
    .messages::-webkit-scrollbar,.session-list::-webkit-scrollbar,.doc-list::-webkit-scrollbar{width:4px;}
    .messages::-webkit-scrollbar-thumb,.session-list::-webkit-scrollbar-thumb,.doc-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

    .welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:48px; }
    .welcome-title { font-family:var(--serif); font-size:36px; letter-spacing:-0.02em; line-height:1.2; }
    .welcome-title em { color:var(--accent); font-style:italic; }
    .welcome-sub { color:var(--muted); font-size:14px; max-width:420px; }
    .welcome-hints { display:flex; flex-direction:column; gap:8px; margin-top:12px; width:100%; max-width:500px; }
    .hint-chip { padding:10px 16px; border:1px solid var(--border); border-radius:8px; font-size:13px; color:var(--muted); cursor:pointer; text-align:left; background:var(--surface); transition:border-color .2s,color .2s,background .2s; }
    .hint-chip:hover { border-color:var(--accent); color:var(--text); background:rgba(108,140,245,.04); }

    .msg { display:flex; flex-direction:column; gap:6px; max-width:820px; width:100%; margin:0 auto; animation:fadeIn .25s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .msg-role { font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:var(--mono); }
    .msg.user { align-items:flex-end; }
    .msg.assistant { align-items:flex-start; }
    .msg.user .msg-role { color:var(--accent); }
    .msg.assistant .msg-role { color:var(--gold); }
    .msg-body { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:14px; line-height:1.75; white-space:pre-wrap; word-break:break-word; }
    .msg.user .msg-body { background:rgba(108,140,245,.10); border-color:rgba(108,140,245,.22); max-width:78%; border-bottom-right-radius:4px; }
    .msg.assistant .msg-body { border-color:var(--border2); max-width:100%; border-bottom-left-radius:4px; }
    .msg.assistant .sources { width:100%; }
    .msg-body { user-select:text; cursor:default; }
    /* UI chrome should not show a text caret or be selectable */
    .topbar,.sidebar,.msg-role,.sidebar-title,.session-title,.kb-stats,.source-meta,.input-hint,.supported-types,.upload-text,.welcome-title,.welcome-sub { user-select:none; }
    .msg-actions { display:flex; gap:6px; margin-top:6px; opacity:0; transition:opacity .15s; }
    .msg:hover .msg-actions { opacity:1; }
    .msg.user .msg-actions { justify-content:flex-end; }
    .msg-action { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:6px; cursor:pointer; transition:border-color .15s,color .15s; }
    .msg-action:hover { border-color:var(--accent); color:var(--text); }
    .msg-action.ok { color:var(--success); border-color:var(--success); }
    .msg-action svg { display:block; width:14px; height:14px; }
    /* Markdown rendering inside assistant messages */
    .msg-body.md { white-space:normal; }
    .msg-body.md strong { font-weight:600; color:#fff; }
    .msg-body.md em { font-style:italic; }
    .md-list { margin:6px 0 6px 22px; }
    .md-list li { margin:3px 0; }
    .md-h { font-weight:600; margin:10px 0 4px; color:#fff; }
    .md-code { background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:var(--mono); font-size:12.5px; }
    .md-pre { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; overflow-x:auto; margin:8px 0; }
    .md-pre code { font-family:var(--mono); font-size:12.5px; background:none; border:none; padding:0; }
    .msg-body.md mjx-container { margin:2px 0; }
    .msg-body.md mjx-container[display="true"] { margin:10px 0; overflow-x:auto; overflow-y:hidden; }

    /* Confirmation modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:200; }
    .modal-overlay.open { display:flex; animation:fadeIn .15s ease; }
    .modal { background:var(--surface); border:1px solid var(--border2); border-radius:14px; padding:22px; width:340px; max-width:90vw; box-shadow:0 16px 48px rgba(0,0,0,.5); }
    .modal-msg { font-size:14px; line-height:1.6; margin-bottom:20px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; }
    .modal-btn { padding:8px 16px; border-radius:8px; font-family:var(--sans); font-size:13px; cursor:pointer; border:1px solid var(--border2); background:transparent; color:var(--text); transition:background .15s,border-color .15s; }
    .modal-btn.cancel:hover { background:var(--surface2); }
    .modal-btn.danger { background:rgba(224,82,82,.15); border-color:rgba(224,82,82,.4); color:#ff8585; }
    .modal-btn.danger:hover { background:rgba(224,82,82,.25); }

    /* Per-code-block copy button */
    .code-block { position:relative; }
    .code-copy { position:absolute; top:6px; right:6px; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:6px; cursor:pointer; opacity:0; transition:opacity .15s,border-color .15s,color .15s; }
    .code-block:hover .code-copy { opacity:1; }
    .code-copy:hover { border-color:var(--accent); color:var(--text); }
    .code-copy.ok { color:var(--success); border-color:var(--success); }
    .code-copy svg { width:13px; height:13px; display:block; }

    /* Reply-to-selection */
    .sel-reply { position:fixed; z-index:150; display:none; align-items:center; gap:6px; background:var(--accent2); color:#fff; border:none; border-radius:8px; padding:6px 12px; font-size:12px; font-family:var(--sans); cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.45); }
    .sel-reply:hover { background:var(--accent); }
    .sel-reply svg { width:13px; height:13px; }
    .reply-chip { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border2); border-left:3px solid var(--accent); border-radius:8px; padding:6px 10px; margin-bottom:8px; font-size:12px; color:var(--muted); }
    .reply-chip-text { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .reply-chip-x { background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:14px; line-height:1; }
    .reply-chip-x:hover { color:var(--danger); }
    .msg-quote { border-left:3px solid var(--accent); padding:4px 10px; margin:0 0 8px; color:var(--muted); font-size:13px; background:rgba(108,140,245,.06); border-radius:0 6px 6px 0; }

    /* Version navigation (edit history) */
    .ver-nav { display:inline-flex; align-items:center; gap:6px; margin-bottom:5px; font-family:var(--mono); font-size:11px; color:var(--muted); }
    .msg.user .ver-nav { align-self:flex-end; }
    .ver-btn { background:transparent; border:1px solid var(--border); color:var(--muted); width:20px; height:20px; border-radius:5px; cursor:pointer; line-height:1; padding:0; }
    .ver-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--text); }
    .ver-btn:disabled { opacity:.35; cursor:default; }

    /* Inline edit */
    .edit-area { width:100%; min-height:60px; background:var(--bg); border:1px solid var(--border2); border-radius:8px; color:var(--text); font-family:var(--sans); font-size:14px; padding:8px 10px; resize:vertical; outline:none; }
    .edit-area:focus { border-color:var(--accent); }
    .edit-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
    .edit-cancel, .edit-save { padding:6px 14px; border-radius:7px; font-size:13px; cursor:pointer; border:1px solid var(--border2); background:transparent; color:var(--text); font-family:var(--sans); }
    .edit-save { background:var(--accent2); border-color:var(--accent2); color:#fff; }
    .edit-save:hover { background:var(--accent); }
    .edit-cancel:hover { background:var(--surface2); }
    .msg-body.thinking { display:flex; align-items:center; gap:6px; color:var(--muted); font-style:italic; }
    .cursor::after { content:'▋'; color:var(--accent); animation:blink 1s steps(2) infinite; }
    @keyframes blink { 0%,50%{opacity:1}50.01%,100%{opacity:0} }
    .dots span { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--muted); animation:dot 1.2s infinite; }
    .dots span:nth-child(2){animation-delay:.2s;} .dots span:nth-child(3){animation-delay:.4s;}
    @keyframes dot {0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1);opacity:1}}

    .sources { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
    .source-header { font-size:10px; color:var(--muted); font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
    .source-item { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:8px 12px; font-size:12px; cursor:pointer; transition:border-color .15s; }
    .source-item:hover { border-color:var(--border2); }
    .source-meta { display:flex; gap:10px; margin-bottom:4px; }
    .source-file { font-family:var(--mono); color:var(--accent); font-size:11px; }
    .source-score { font-family:var(--mono); color:var(--muted); font-size:11px; }
    .source-text { color:var(--muted); font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .source-expanded .source-text { -webkit-line-clamp:unset; }

    .input-bar { padding:16px 8%; border-top:1px solid var(--border); background:var(--surface); }
    .input-wrap { display:flex; align-items:flex-end; gap:10px; background:var(--bg); border:1px solid var(--border2); border-radius:12px; padding:10px 14px; transition:border-color .2s; }
    .input-wrap:focus-within { border-color:var(--accent); }
    textarea { flex:1; background:transparent; border:none; outline:none; resize:none; font-family:var(--sans); font-size:14px; color:var(--text); min-height:22px; max-height:160px; line-height:1.5; }
    textarea::placeholder { color:var(--muted); }
    .send-btn { width:36px; height:36px; border-radius:8px; background:var(--accent2); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s,transform .1s; flex-shrink:0; }
    .send-btn:hover { background:var(--accent); }
    .send-btn:active { transform:scale(.95); }
    .send-btn:disabled { background:var(--border); cursor:not-allowed; opacity:.5; }
    .send-btn svg { width:16px; height:16px; fill:white; }
    .input-hint { text-align:right; font-size:11px; color:var(--muted); margin-top:6px; font-family:var(--mono); }

    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; font-size:13px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 32px rgba(0,0,0,.4); animation:slideUp .3s ease; z-index:100; max-width:360px; }
    .toast.success { border-color:rgba(76,175,125,.4); } .toast.error { border-color:rgba(224,82,82,.4); }
    .toast-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .toast.success .toast-dot { background:var(--success); } .toast.error .toast-dot { background:var(--danger); }
    @keyframes slideUp { from{opacity:0;transform:translate(-50%,12px)} to{opacity:1;transform:translate(-50%,0)} }
  </style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-logo">RAG <span>Local</span></div>
    <div class="topbar-sep"></div>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="fr">FR</button><button data-lang="en">EN</button>
    </div>
  </header>

  <!-- Left: conversations -->
  <aside class="sidebar left">
    <div class="sidebar-head"><div class="sidebar-title" data-i18n="conversations">Conversations</div></div>
    <button class="new-chat-btn" id="newChatBtn" onclick="newSession()" data-i18n="new_conversation">＋ Nouvelle conversation</button>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <!-- Center: chat -->
  <main class="main">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <div class="reply-chip" id="replyChip" style="display:none;">
        <span class="reply-chip-text" id="replyChipText"></span>
        <button class="reply-chip-x" id="replyChipX" title="✕">✕</button>
      </div>
      <div class="input-wrap">
        <textarea id="questionInput" data-i18n-ph="input_placeholder" placeholder="Posez votre question…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendQuestion()" disabled>
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
        </button>
      </div>
      <div class="input-hint" data-i18n="input_hint">Enter pour envoyer · Shift+Enter pour nouvelle ligne</div>
    </div>
  </main>

  <!-- Right: knowledge base -->
  <aside class="sidebar right">
    <div class="sidebar-head"><div class="sidebar-title" data-i18n="add_document">Ajouter un document</div></div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.md,.csv,.xlsx" multiple>
      <div class="upload-icon">📄</div>
      <div class="upload-text" data-i18n-html="drag_or_click"><strong>Glissez</strong> ou cliquez</div>
      <div class="supported-types">PDF · TXT · DOCX · MD · CSV · XLSX</div>
    </div>
    <div class="upload-progress" id="uploadProgress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel" data-i18n="indexing">Indexation…</div>
    </div>
    <div class="sidebar-head" style="margin-top:8px;"><div class="sidebar-title" data-i18n="knowledge_base">Base de connaissance</div></div>
    <div class="doc-list" id="docList"></div>
    <div class="kb-stats">
      <div class="stat"><span data-i18n="chunks">Chunks</span>: <strong id="statChunks">—</strong></div>
      <div class="stat"><span data-i18n="docs">Docs</span>: <strong id="statDocs">—</strong></div>
    </div>
  </aside>
</div>

<!-- Floating "reply to selection" button -->
<button class="sel-reply" id="selReply">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17l-6-5 6-5"/><path d="M3 12h11a6 6 0 0 1 6 6v1"/></svg>
  <span data-i18n="reply">Répondre</span>
</button>

<!-- Confirmation modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">Annuler</button>
      <button class="modal-btn danger" id="modalConfirm">Supprimer</button>
    </div>
  </div>
</div>

<script>
  const API = '/api';
  let activeStream = null; // single in-flight generation: {sessionId, answer, sources, done, error, thinking, controller}
  let documents = [];
  let sessions = [];
  let currentSessionId = null;
  let currentStatus = 'loading';

  // ─── i18n ─────────────────────────────────────────────────────────────────
  const I18N = {
    fr: {
      status_ready:'prêt', status_loading:'chargement…', status_error:'erreur',
      conversations:'Conversations',
      new_conversation:'＋ Nouvelle conversation',
      no_conversations:'Aucune conversation.<br>Créez-en une pour commencer.',
      welcome_title:'Interrogez votre<br><em>base de connaissance</em>',
      welcome_sub:"Vos documents restent 100% locaux. Posez vos questions dans n'importe quelle langue — l'assistant garde le contexte de la conversation.",
      hint1:'Résume les points clés des documents disponibles',
      hint2:'Quels sont les sujets principaux abordés ?',
      hint3:'Donne-moi une liste des concepts importants',
      input_placeholder:'Posez votre question…',
      input_hint:'Enter pour envoyer · Shift+Enter pour nouvelle ligne',
      add_document:'Ajouter un document',
      drag_or_click:'<strong>Glissez</strong> ou cliquez',
      indexing:'Indexation…',
      indexing_file:'Indexation de "{name}"…',
      knowledge_base:'Base de connaissance',
      no_documents:'Aucun document indexé.<br>Ajoutez des fichiers pour commencer.',
      chunks:'Chunks', docs:'Docs',
      role_user:'Vous', role_assistant:'Assistant',
      sources:'Sources',
      copy:'Copier', copied:'Copié', edit:'Modifier', copy_failed:'Échec de la copie',
      reply_ready:'Réponse prête : « {title} »',
      delete:'Supprimer', cancel:'Annuler', reply:'Répondre', save:'Enregistrer',
      searching:'Recherche dans la base…',
      no_response:'(aucune réponse)',
      greeting:"Bonjour 👋 Je suis votre assistant. Posez-moi une question, ou ajoutez des documents et je m'appuierai dessus pour vous répondre.",
      confirm_del_session:'Supprimer cette conversation ?',
      confirm_del_doc:'Supprimer "{name}" de la base ?',
      toast_indexed:'"{name}" indexé ({n} chunks).',
      toast_deleted:'"{name}" supprimé.',
      toast_del_error:'Erreur lors de la suppression.',
      toast_upload_error:'Erreur : {msg}',
      toast_backend:'Backend injoignable. Vérifiez que les services tournent.',
      toast_create_error:'Impossible de créer la conversation.',
      toast_load_error:'Impossible de charger la conversation.',
      backend_no_response:'Le backend ne répond pas.',
    },
    en: {
      status_ready:'ready', status_loading:'loading…', status_error:'error',
      conversations:'Conversations',
      new_conversation:'＋ New conversation',
      no_conversations:'No conversations yet.<br>Create one to get started.',
      welcome_title:'Query your<br><em>knowledge base</em>',
      welcome_sub:'Your documents stay 100% local. Ask in any language — the assistant keeps the conversation context.',
      hint1:'Summarize the key points of the available documents',
      hint2:'What are the main topics covered?',
      hint3:'Give me a list of the important concepts',
      input_placeholder:'Ask your question…',
      input_hint:'Enter to send · Shift+Enter for a new line',
      add_document:'Add a document',
      drag_or_click:'<strong>Drag</strong> or click',
      indexing:'Indexing…',
      indexing_file:'Indexing "{name}"…',
      knowledge_base:'Knowledge base',
      no_documents:'No documents indexed.<br>Add files to get started.',
      chunks:'Chunks', docs:'Docs',
      role_user:'You', role_assistant:'Assistant',
      sources:'Sources',
      copy:'Copy', copied:'Copied', edit:'Edit', copy_failed:'Copy failed',
      reply_ready:'Reply ready: "{title}"',
      delete:'Delete', cancel:'Cancel', reply:'Reply', save:'Save',
      searching:'Searching the knowledge base…',
      no_response:'(no response)',
      greeting:"Hi 👋 I'm your assistant. Ask me anything, or add documents and I'll use them to answer.",
      confirm_del_session:'Delete this conversation?',
      confirm_del_doc:'Delete "{name}" from the knowledge base?',
      toast_indexed:'"{name}" indexed ({n} chunks).',
      toast_deleted:'"{name}" deleted.',
      toast_del_error:'Error while deleting.',
      toast_upload_error:'Error: {msg}',
      toast_backend:'Backend unreachable. Make sure the services are running.',
      toast_create_error:'Could not create the conversation.',
      toast_load_error:'Could not load the conversation.',
      backend_no_response:'The backend is not responding.',
    }
  };

  let lang = localStorage.getItem('ragLang') || ((navigator.language || 'fr').startsWith('en') ? 'en' : 'fr');

  function t(key, vars) {
    let s = (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }

  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
    document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }

  function setLang(l) {
    lang = l;
    localStorage.setItem('ragLang', l);
    applyI18n();
    renderSessions();
    renderDocs();
    if (currentSessionId) openSession(currentSessionId); else renderLanding();
  }

  document.getElementById('langToggle').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) setLang(b.dataset.lang);
  });

  // ─── Init ─────────────────────────────────────────────────────────────────
  async function init() {
    applyI18n();
    renderLanding();
    setStatus('loading');
    try {
      const res = await fetch(`${API}/`);
      const data = await res.json();
      setStatus('ready');
      updateStats(data.doc_count, data.total_documents);
      await Promise.all([refreshDocs(), refreshSessions()]);
    } catch (e) {
      setStatus('error');
      showToast(t('toast_backend'), 'error');
    }
  }

  function setStatus(s) {
    currentStatus = s;
    updateSendBtn();
  }
  function updateSendBtn() {
    const busy = !!(activeStream && !activeStream.done);
    document.getElementById('sendBtn').disabled = busy || currentStatus !== 'ready';
  }
  function updateStats(chunks, docCount) {
    if (chunks >= 0) document.getElementById('statChunks').textContent = chunks.toLocaleString();
    if (docCount >= 0) document.getElementById('statDocs').textContent = docCount;
  }

  // ─── Sessions ───────────────────────────────────────────────────────────────
  async function refreshSessions() {
    try {
      const res = await fetch(`${API}/sessions`);
      const data = await res.json();
      sessions = data.sessions || [];
      renderSessions();
    } catch (e) {}
  }

  function renderSessions() {
    const list = document.getElementById('sessionList');
    if (!sessions.length) {
      list.innerHTML = `<div class="empty-hint">${t('no_conversations')}</div>`;
      return;
    }
    list.innerHTML = '';
    sessions.forEach(s => {
      const el = document.createElement('div');
      el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      el.onclick = (ev) => { if (!ev.target.classList.contains('session-del')) openSession(s.id); };
      el.innerHTML = `
        <span class="session-ico">💬</span>
        <span class="session-title" title="${escHtml(s.title)}">${escHtml(s.title)}</span>
        <button class="session-del" title="✕" onclick="deleteSession('${s.id}', event)">✕</button>`;
      list.appendChild(el);
    });
  }

  async function newSession() {
    try {
      const res = await fetch(`${API}/sessions`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({})
      });
      const s = await res.json();
      currentSessionId = s.id;
      await refreshSessions();
      showGreeting();
      updateSendBtn();
    } catch (e) { showToast(t('toast_create_error'), 'error'); }
  }

  async function openSession(id) {
    currentSessionId = id;
    renderSessions();
    updateSendBtn();
    try {
      const res = await fetch(`${API}/sessions/${id}`);
      const data = await res.json();
      renderMessages(data.messages || []);
    } catch (e) { showToast(t('toast_load_error'), 'error'); }
  }

  async function deleteSession(id, ev) {
    ev.stopPropagation();
    if (!(await showConfirm(t('confirm_del_session')))) return;
    // Abort an in-flight generation that belongs to the session being deleted.
    if (activeStream && activeStream.sessionId === id) {
      try { activeStream.controller.abort(); } catch (e) {}
      activeStream = null;
      updateSendBtn();
    }
    try {
      await fetch(`${API}/sessions/${id}`, { method: 'DELETE' });
      if (currentSessionId === id) { currentSessionId = null; renderLanding(); }
      await refreshSessions();
    } catch (e) { showToast(t('toast_del_error'), 'error'); }
  }

  // ─── Center rendering ─────────────────────────────────────────────────────
  function renderLanding() {
    document.getElementById('messages').innerHTML = `
      <div class="welcome">
        <div class="welcome-title">${t('welcome_title')}</div>
        <div class="welcome-sub">${t('welcome_sub')}</div>
        <div class="welcome-hints">
          <div class="hint-chip" onclick="setQuestion(this)">${escHtml(t('hint1'))}</div>
          <div class="hint-chip" onclick="setQuestion(this)">${escHtml(t('hint2'))}</div>
          <div class="hint-chip" onclick="setQuestion(this)">${escHtml(t('hint3'))}</div>
        </div>
      </div>`;
  }

  // Assistant greets first in a brand-new / empty conversation (UI-only, not stored).
  function showGreeting() {
    document.getElementById('messages').innerHTML = '';
    appendAnswerMessage(t('greeting'), []);
  }

  function renderMessages(messages) {
    const msgs = document.getElementById('messages');
    msgs.innerHTML = '';
    const hasActive = activeStream && !activeStream.done && activeStream.sessionId === currentSessionId;
    if (!messages.length && !hasActive) { showGreeting(); return; }
    messages.forEach(m => {
      if (m.role === 'user') renderUserMsg(m);
      else renderAssistantMsg(m);
    });
    ensureStreamBubble(); // re-attach a live answer if we navigated back mid-generation
    typesetMath(msgs);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // Creates/updates the live assistant bubble for the active stream, but only
  // when the user is actually viewing that conversation. This is what lets you
  // leave and come back without losing the in-progress (or finished) answer.
  function ensureStreamBubble() {
    if (!activeStream || currentSessionId !== activeStream.sessionId) return;
    const msgs = document.getElementById('messages');
    const w = msgs.querySelector('.welcome'); if (w) w.remove();
    let el = document.getElementById('activeStreamMsg');
    if (!el) {
      el = document.createElement('div');
      el.className = 'msg assistant';
      el.id = 'activeStreamMsg';
      msgs.appendChild(el);
    }
    const role = `<div class="msg-role">${escHtml(t('role_assistant'))}</div>`;
    if (activeStream.error) {
      el.innerHTML = role + `<div class="msg-body">⚠️ ${escHtml(activeStream.error)}</div>`;
    } else if (activeStream.thinking && !activeStream.answer) {
      el.innerHTML = role + `<div class="msg-body thinking"><div class="dots"><span></span><span></span><span></span></div>${escHtml(t('searching'))}</div>`;
    } else {
      el.innerHTML = role + `<div class="msg-body md${activeStream.done ? '' : ' cursor'}">${renderMarkdown(activeStream.answer)}</div>` + renderSourcesHtml(activeStream.sources);
    }
    if (activeStream.done && !activeStream.error && activeStream.answer) {
      el.appendChild(buildActions(activeStream.answer, false));
    }
    if (activeStream.done) { el.removeAttribute('id'); typesetMath(el); } // becomes a normal message
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendUserMessage(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `<div class="msg-role">${escHtml(t('role_user'))}</div><div class="msg-body">${renderUserContent(text)}</div>`;
    el.appendChild(buildActions(text, true));
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // User messages are literal, but leading "> " lines render as a quote block
  // (used by the reply-to-selection feature).
  function renderUserContent(text) {
    const lines = escHtml(text == null ? '' : String(text)).split('\n');
    let html = '', quote = [];
    const flush = () => { if (quote.length) { html += '<div class="msg-quote">' + quote.join('<br>') + '</div>'; quote = []; } };
    for (const l of lines) {
      const m = l.match(/^&gt;\s?(.*)$/);
      if (m) quote.push(m[1]); else { flush(); html += l + '<br>'; }
    }
    flush();
    return html.replace(/<br>$/, '');
  }

  function appendAnswerMessage(answer, sources) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg assistant';
    el.innerHTML = `<div class="msg-role">${escHtml(t('role_assistant'))}</div>
      <div class="msg-body md">${renderMarkdown(answer)}</div>${renderSourcesHtml(sources)}`;
    el.appendChild(buildActions(answer, false));
    msgs.appendChild(el);
    typesetMath(el);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // Copy (all messages) + Edit (user messages) icon actions.
  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

  function buildActions(text, isUser) {
    const row = document.createElement('div');
    row.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-action';
    copyBtn.innerHTML = ICON_COPY;
    copyBtn.title = t('copy');
    copyBtn.onclick = () => copyText(text, copyBtn);
    row.appendChild(copyBtn);
    if (isUser) {
      const editBtn = document.createElement('button');
      editBtn.className = 'msg-action';
      editBtn.innerHTML = ICON_EDIT;
      editBtn.title = t('edit');
      editBtn.onclick = () => editMessage(text);
      row.appendChild(editBtn);
    }
    return row;
  }

  function copyText(text, btn) {
    const ok = () => {
      btn.classList.add('ok'); btn.innerHTML = ICON_CHECK; btn.title = t('copied');
      setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = ICON_COPY; btn.title = t('copy'); }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(() => showToast(t('copy_failed'), 'error'));
    } else {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { showToast(t('copy_failed'), 'error'); }
      ta.remove();
    }
  }

  function editMessage(text) {
    const input = document.getElementById('questionInput');
    input.value = text; autoResize(input); input.focus();
  }

  function renderSourcesHtml(sources) {
    if (!sources || !sources.length) return '';
    const items = sources.map(s => `
      <div class="source-item" onclick="this.classList.toggle('source-expanded')">
        <div class="source-meta">
          <span class="source-file">📎 ${escHtml(s.filename)}</span>
          ${s.page && s.page !== '?' ? `<span class="source-score">p.${escHtml(String(s.page))}</span>` : ''}
        </div>
        <div class="source-text">${escHtml(s.text)}</div>
      </div>`).join('');
    return `<div class="sources"><div class="source-header">${t('sources')} (${sources.length})</div>${items}</div>`;
  }

  // ── History rendering: version navigation + inline edit (ChatGPT-style) ──
  function buildVersionNav(m) {
    if (!m.version_count || m.version_count <= 1) return null;
    const wrap = document.createElement('div');
    wrap.className = 'ver-nav';
    const prev = document.createElement('button');
    prev.className = 'ver-btn'; prev.textContent = '‹'; prev.disabled = m.version_index <= 1;
    prev.onclick = () => switchVersion(m.sibling_ids[m.version_index - 2]);
    const lbl = document.createElement('span');
    lbl.className = 'ver-lbl'; lbl.textContent = m.version_index + '/' + m.version_count;
    const next = document.createElement('button');
    next.className = 'ver-btn'; next.textContent = '›'; next.disabled = m.version_index >= m.version_count;
    next.onclick = () => switchVersion(m.sibling_ids[m.version_index]);
    wrap.append(prev, lbl, next);
    return wrap;
  }

  async function switchVersion(id) {
    if (!id || (activeStream && !activeStream.done)) return;
    try {
      await fetch(`${API}/sessions/${currentSessionId}/messages/${id}/select`, { method: 'POST' });
      await openSession(currentSessionId);
    } catch (e) { showToast(t('toast_load_error'), 'error'); }
  }

  function iconBtn(svg, title, onclick) {
    const b = document.createElement('button');
    b.className = 'msg-action'; b.innerHTML = svg; b.title = title; b.onclick = onclick;
    return b;
  }

  function renderUserMsg(m) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg user'; el.dataset.id = m.id;
    el.innerHTML = `<div class="msg-role">${escHtml(t('role_user'))}</div>`;
    const nav = buildVersionNav(m); if (nav) el.appendChild(nav);
    const body = document.createElement('div');
    body.className = 'msg-body'; body.innerHTML = renderUserContent(m.content);
    el.appendChild(body);
    const row = document.createElement('div'); row.className = 'msg-actions';
    row.appendChild(iconBtn(ICON_COPY, t('copy'), function () { copyText(m.content, this); }));
    row.appendChild(iconBtn(ICON_EDIT, t('edit'), () => startEdit(el, m)));
    el.appendChild(row);
    msgs.appendChild(el);
  }

  function renderAssistantMsg(m) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg assistant'; el.dataset.id = m.id;
    el.innerHTML = `<div class="msg-role">${escHtml(t('role_assistant'))}</div>`;
    const nav = buildVersionNav(m); if (nav) el.appendChild(nav);
    const body = document.createElement('div');
    body.className = 'msg-body md'; body.innerHTML = renderMarkdown(m.content);
    el.appendChild(body);
    el.insertAdjacentHTML('beforeend', renderSourcesHtml(m.sources || []));
    const row = document.createElement('div'); row.className = 'msg-actions';
    row.appendChild(iconBtn(ICON_COPY, t('copy'), function () { copyText(m.content, this); }));
    el.appendChild(row);
    msgs.appendChild(el);
  }

  function startEdit(el, m) {
    const body = el.querySelector('.msg-body');
    body.innerHTML = '';
    const ta = document.createElement('textarea');
    ta.className = 'edit-area'; ta.value = m.content;
    body.appendChild(ta);
    const actions = document.createElement('div'); actions.className = 'edit-actions';
    const cancel = document.createElement('button'); cancel.className = 'edit-cancel'; cancel.textContent = t('cancel');
    cancel.onclick = () => openSession(currentSessionId);
    const save = document.createElement('button'); save.className = 'edit-save'; save.textContent = t('save');
    save.onclick = () => saveEdit(m.id, ta.value.trim());
    actions.append(cancel, save);
    body.appendChild(actions);
    ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
    ta.focus();
    const row = el.querySelector('.msg-actions'); if (row) row.style.display = 'none';
  }

  async function saveEdit(messageId, newText) {
    if (!newText || (activeStream && !activeStream.done)) return;
    const sid = currentSessionId;
    const el = document.querySelector(`.msg[data-id="${messageId}"]`);
    if (el) {
      el.querySelector('.msg-body').innerHTML = renderUserContent(newText);
      const row = el.querySelector('.msg-actions'); if (row) row.style.display = '';
      while (el.nextElementSibling) el.nextElementSibling.remove(); // drop the old downstream branch view
    }
    await runStream(`${API}/sessions/${sid}/messages/${messageId}/edit`, { message: newText }, sid, {});
  }

  // ─── Chat (streaming NDJSON) ─────────────────────────────────────────────────
  function setQuestion(el) { document.getElementById('questionInput').value = el.textContent; sendQuestion(); }
  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }

  async function sendQuestion() {
    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    if (!question) return;
    if (activeStream && !activeStream.done) return; // one generation at a time
    if (currentStatus !== 'ready') return;

    if (!currentSessionId) { await newSession(); if (!currentSessionId) return; }
    const sid = currentSessionId;
    const firstTurn = !document.querySelector('#messages .msg.user'); // no user message yet

    const welcome = document.querySelector('#messages .welcome');
    if (welcome) welcome.remove();

    input.value = ''; input.style.height = 'auto';

    // If the user is replying to a selected passage, prepend it as a quote.
    let toSend = question;
    if (replyQuote) {
      toSend = '> ' + replyQuote.replace(/\n+/g, '\n> ') + '\n\n' + question;
      clearReplyQuote();
    }
    appendUserMessage(toSend);
    await runStream(`${API}/sessions/${sid}/chat`, { message: toSend }, sid, { firstTurn });
  }

  // Shared streaming runner used by both new turns and edits (regeneration).
  // On completion it reloads the active branch so version arrows / edit controls
  // reflect the persisted conversation tree.
  async function runStream(url, payload, sid, opts) {
    opts = opts || {};
    const controller = new AbortController();
    activeStream = { sessionId: sid, answer: '', sources: [], done: false, error: null, thinking: true, controller };
    let doneTitle = null;
    updateSendBtn();
    ensureStreamBubble();

    try {
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload), signal: controller.signal
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || ('HTTP ' + res.status));
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line) continue;
          let evt; try { evt = JSON.parse(line); } catch { continue; }
          if (!activeStream) break;

          if (evt.type === 'token') {
            activeStream.thinking = false;
            activeStream.answer += evt.data;
            ensureStreamBubble();
          } else if (evt.type === 'sources') {
            activeStream.sources = evt.data;
            ensureStreamBubble();
          } else if (evt.type === 'error') {
            activeStream.error = evt.data;
            ensureStreamBubble();
          } else if (evt.type === 'done') {
            doneTitle = evt.title;
          }
        }
        if (!activeStream) break;
      }
    } catch (e) {
      if (activeStream && e.name !== 'AbortError') {
        activeStream.error = (e.message || t('backend_no_response'));
      }
    } finally {
      const finishedAway = sid !== currentSessionId;
      if (activeStream && activeStream.sessionId === sid) {
        activeStream.done = true;
        if (activeStream.thinking && !activeStream.answer && !activeStream.error) {
          activeStream.error = t('no_response');
        }
        ensureStreamBubble();
        activeStream = null;
        if (finishedAway) {
          const s = sessions.find(x => x.id === sid);
          showToast(t('reply_ready', { title: doneTitle || (s && s.title) || '' }), 'success');
        }
      }
      updateSendBtn();
      if (opts.firstTurn) { try { await fetch(`${API}/sessions/${sid}/autotitle`, { method: 'POST' }); } catch (e) {} }
      await refreshSessions();
      // Reload the canonical tree view (adds version arrows / edit affordances).
      if (!finishedAway && sid === currentSessionId) { await openSession(sid); }
    }
  }

  // ─── Documents ───────────────────────────────────────────────────────────────
  async function refreshDocs() {
    try {
      const res = await fetch(`${API}/documents`);
      const data = await res.json();
      documents = data.documents || [];
      renderDocs();
      updateStats(-1, documents.length);
    } catch (e) {}
  }

  function renderDocs() {
    const list = document.getElementById('docList');
    if (!documents.length) {
      list.innerHTML = `<div class="empty-hint">${t('no_documents')}</div>`;
      return;
    }
    list.innerHTML = '';
    documents.forEach(doc => {
      const ext = doc.name.split('.').pop().toLowerCase();
      const map = { pdf:'PDF', txt:'TXT', docx:'DOC', doc:'DOC', md:'MD', csv:'CSV', xlsx:'XLS' };
      const el = document.createElement('div');
      el.className = 'doc-item';
      el.innerHTML = `
        <div class="doc-icon ${ext}">${map[ext] || ext.toUpperCase().slice(0,3)}</div>
        <div class="doc-name" title="${escHtml(doc.name)}">${escHtml(doc.name)}</div>
        <div class="doc-chunks">${doc.chunks ?? '?'}</div>
        <button class="doc-del" title="✕" onclick="deleteDoc('${escAttr(doc.name)}')">✕</button>`;
      list.appendChild(el);
    });
  }

  async function deleteDoc(name) {
    if (!(await showConfirm(t('confirm_del_doc', { name })))) return;
    try {
      await fetch(`${API}/documents/${encodeURIComponent(name)}`, { method: 'DELETE' });
      showToast(t('toast_deleted', { name }), 'success');
      await refreshDocs();
      const st = await (await fetch(`${API}/`)).json();
      updateStats(st.doc_count, st.total_documents);
    } catch (e) { showToast(t('toast_del_error'), 'error'); }
  }

  const zone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); uploadFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

  async function uploadFiles(files) {
    if (!files.length) return;
    const prog = document.getElementById('uploadProgress');
    const fill = document.getElementById('progressFill');
    const label = document.getElementById('progressLabel');
    prog.classList.add('visible'); fill.style.width = '15%';

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      label.textContent = t('indexing_file', { name: file.name });
      fill.style.width = ((i / files.length) * 75 + 15) + '%';
      const form = new FormData(); form.append('file', file);
      try {
        const res = await fetch(`${API}/upload`, { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        showToast(t('toast_indexed', { name: file.name, n: data.chunks_added }), 'success');
      } catch (e) { showToast(t('toast_upload_error', { msg: e.message }), 'error'); }
    }
    fill.style.width = '100%';
    setTimeout(() => { prog.classList.remove('visible'); fill.style.width = '0'; label.textContent = t('indexing'); }, 800);
    fileInput.value = '';
    await refreshDocs();
    try { const st = await (await fetch(`${API}/`)).json(); updateStats(st.doc_count, st.total_documents); } catch (e) {}
  }

  // ─── Utils ───────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Minimal, safe Markdown renderer. Math (\(..\), \[..\], $$..$$) is extracted
  // first so neither escaping nor markdown corrupts it; MathJax typesets it after.
  function renderMarkdown(src) {
    src = src == null ? '' : String(src);
    const math = [];
    const stash = (mm) => { math.push(mm.replace(/\s*\n\s*/g, ' ')); return '\u0000M' + (math.length - 1) + '\u0000'; };
    src = src.replace(/\\\[[\s\S]*?\\\]/g, stash);
    src = src.replace(/\$\$[\s\S]*?\$\$/g, stash);
    src = src.replace(/\\\([\s\S]*?\\\)/g, stash);

    let s = escHtml(src);
    const blocks = [];
    s = s.replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, code) => {
      const c = code.replace(/\n+$/, '');
      blocks.push(
        '<div class="code-block"><button class="code-copy" type="button" title="' + t('copy') +
        '">' + ICON_COPY + '</button><pre class="md-pre"><code>' + c + '</code></pre></div>'
      );
      return '\u0000B' + (blocks.length - 1) + '\u0000';
    });
    s = s.replace(/`([^`\n]+)`/g, '<code class="md-code">$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*/g, '$1<em>$2</em>');
    const out = [];
    let list = null;
    const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    for (const raw of s.split('\n')) {
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { close(); out.push('<div class="md-h">' + m[1] + '</div>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out.push('<ol class="md-list">'); list = 'ol'; } out.push('<li>' + m[1] + '</li>'); }
      else if ((m = raw.match(/^\s*[-*+]\s+(.*)$/))) { if (list !== 'ul') { close(); out.push('<ul class="md-list">'); list = 'ul'; } out.push('<li>' + m[1] + '</li>'); }
      else { close(); out.push(raw); }
    }
    close();
    let html = out.join('\n').replace(/\u0000B(\d+)\u0000/g, (_, i) => blocks[i]);
    html = html.replace(/\u0000M(\d+)\u0000/g, (_, i) => math[i]); // restore raw math for MathJax
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/(<\/(?:ul|ol|li|pre|div)>)<br>/g, '$1');
    html = html.replace(/<br>(<(?:ul|ol|pre|div|li))/g, '$1');
    return html;
  }

  function typesetMath(el) {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise(el ? [el] : undefined).catch(() => {});
    }
  }
  function escAttr(str) { return String(str).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

  function showToast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-dot"></div><span>${escHtml(msg)}</span>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  // ─── Confirmation modal ───────────────────────────────────────────────────
  let _modalResolve = null;
  function showConfirm(message) {
    return new Promise(resolve => {
      _modalResolve = resolve;
      document.getElementById('modalMsg').textContent = message;
      document.getElementById('modalConfirm').textContent = t('delete');
      document.getElementById('modalCancel').textContent = t('cancel');
      document.getElementById('modalOverlay').classList.add('open');
    });
  }
  function closeModal(result) {
    document.getElementById('modalOverlay').classList.remove('open');
    if (_modalResolve) { _modalResolve(result); _modalResolve = null; }
  }
  document.getElementById('modalConfirm').addEventListener('click', () => closeModal(true));
  document.getElementById('modalCancel').addEventListener('click', () => closeModal(false));
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('open')) closeModal(false);
  });

  // ─── Reply-to-selection + per-code-block copy ───────────────────────────────
  let replyQuote = null;
  let pendingQuote = null;

  function clearReplyQuote() {
    replyQuote = null;
    document.getElementById('replyChip').style.display = 'none';
  }
  function setReplyQuote(text) {
    replyQuote = text;
    const chip = document.getElementById('replyChip');
    document.getElementById('replyChipText').textContent = '❝ ' + text;
    chip.style.display = 'flex';
  }
  document.getElementById('replyChipX').addEventListener('click', clearReplyQuote);

  // Show a floating "reply" button when text inside an assistant message is selected.
  const selReplyBtn = document.getElementById('selReply');
  selReplyBtn.addEventListener('mousedown', e => e.preventDefault()); // keep the selection
  selReplyBtn.addEventListener('click', () => {
    if (pendingQuote) { setReplyQuote(pendingQuote); document.getElementById('questionInput').focus(); }
    window.getSelection().removeAllRanges();
    selReplyBtn.style.display = 'none';
  });

  document.addEventListener('mouseup', () => setTimeout(positionSelReply, 0));
  document.addEventListener('scroll', () => { selReplyBtn.style.display = 'none'; }, true);

  function positionSelReply() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) { selReplyBtn.style.display = 'none'; return; }
    const node = sel.anchorNode;
    const host = node && (node.nodeType === 3 ? node.parentElement : node);
    const body = host && host.closest && host.closest('.msg.assistant .msg-body');
    if (!body) { selReplyBtn.style.display = 'none'; return; }
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    pendingQuote = sel.toString().trim();
    selReplyBtn.style.display = 'flex';
    selReplyBtn.style.top = Math.max(8, rect.top - 40) + 'px';
    selReplyBtn.style.left = Math.max(8, rect.left) + 'px';
  }

  // Per-code-block copy (event delegation on the messages container).
  document.getElementById('messages').addEventListener('click', e => {
    const btn = e.target.closest('.code-copy');
    if (!btn) return;
    const code = btn.parentElement.querySelector('code');
    if (code) copyText(code.textContent, btn);
  });

  init();
</script>
