# Local RAG — Docker Compose
#
# Two services only: backend (FastAPI + LlamaIndex + embedded ChromaDB + SQLite)
# and frontend (nginx). Ollama runs NATIVELY on the host (best GPU support on
# Windows/WSL2 for the RTX 5050), and the backend reaches it through
# host.docker.internal.
#
# Persistent data (vectors + chat sessions + documents) lives in the named
# volume `rag_data`, so everything survives `docker compose down` / restarts.

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - TITLE_MODEL=${TITLE_MODEL:-}
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - CHROMA_PATH=/app/data/chroma
      - SQLITE_PATH=/app/data/rag.db
      # Fully local: no ChromaDB product telemetry (zero outbound calls at runtime).
      - ANONYMIZED_TELEMETRY=False
      - COLLECTION_NAME=${COLLECTION_NAME:-rag_knowledge_base}
      - CONTEXT_WINDOW=${CONTEXT_WINDOW:-8192}
      - NUM_OUTPUT=${NUM_OUTPUT:-1024}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-600}
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-64}
      - RETRIEVE_TOP_K=${RETRIEVE_TOP_K:-6}
      - RETRIEVE_CANDIDATES=${RETRIEVE_CANDIDATES:-20}
      - HYBRID_ENABLED=${HYBRID_ENABLED:-true}
      - MIN_BM25_SCORE=${MIN_BM25_SCORE:-0.0}
      - STRICT_RAG=${STRICT_RAG:-false}
      - RERANK_TOP_N=${RERANK_TOP_N:-5}
      - RELEVANCE_CUTOFF=${RELEVANCE_CUTOFF:-0.35}
      - SOURCE_MIN_SCORE=${SOURCE_MIN_SCORE:-0.40}
      - SOURCE_REL_GAP=${SOURCE_REL_GAP:-0.10}
      - SOURCE_MAX=${SOURCE_MAX:-4}
      - SOURCE_DISPLAY_MIN_RERANK=${SOURCE_DISPLAY_MIN_RERANK:-0.0}
      - SOURCE_DISPLAY_MIN_RERANK=${SOURCE_DISPLAY_MIN_RERANK:-0.0}
      - SOURCE_DISPLAY_TOP_K=${SOURCE_DISPLAY_TOP_K:-1}
      - QUERY_REWRITE_ENABLED=${QUERY_REWRITE_ENABLED:-true}
      - GROUNDING_MIN_OVERLAP=${GROUNDING_MIN_OVERLAP:-0.18}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_MIN_SCORE=${RERANK_MIN_SCORE:-0.0}
      - RERANK_DEVICE=${RERANK_DEVICE:-cpu}
      - MEMORY_TOKEN_LIMIT=${MEMORY_TOKEN_LIMIT:-3000}
      # Auth / RBAC
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-secret}
      - JWT_TTL_HOURS=${JWT_TTL_HOURS:-12}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local.host}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-25}
      # Cache HuggingFace reranker weights inside the volume (download once).
      - HF_HOME=/app/data/hf_cache
    volumes:
      - rag_data:/app/data
    # Lets the container reach Ollama running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The URL the browser uses to reach the backend (baked at build time).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rag_data:    # vectors (Chroma) + sessions/messages/documents (SQLite) + HF cache